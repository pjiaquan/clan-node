# Pinning actions to commit SHAs (see .github/workflows/*.yml) only stays safe
# if something updates them, so Dependabot covers `github-actions` as well as
# the two npm manifests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the toolchain, so a security bump in a runtime dependency
      # is not buried among wrangler and TypeScript updates.
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom (and their types) must move together: split into
      # two PRs, neither installs, because each @types package peers on the
      # other's version.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint peers on typescript <6.1.0, so a newer TypeScript
      # fails `npm ci`. Lift this once typescript-eslint supports 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
