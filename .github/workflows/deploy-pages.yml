name: Deploy Frontend To GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The API base used to be hard-coded to the default-environment Worker
      # (clan-node.pjiaquan.workers.dev), which runs with ENVIRONMENT =
      # "development" against the production database. Set the repository
      # variable VITE_API_BASE to the production Worker instead
      # (https://clan-node-production.pjiaquan.workers.dev -- the origin
      # functions/api/[[path]].ts already proxies to). Note that the Worker's
      # FRONTEND_ORIGIN must also list this site's origin, or CORS will block
      # it.
      - name: Check API base is configured
        run: |
          if [ -z "${VITE_API_BASE}" ]; then
            echo "::error::VITE_API_BASE repository variable is not set." \
                 "Set it to the production Worker origin before deploying." >&2
            exit 1
          fi
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Build
        run: npm run build
        env:
          VITE_PUBLIC_BASE: /clan-node/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
