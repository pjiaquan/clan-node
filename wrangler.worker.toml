# Cloudflare Workers configuration

name = "clan-node"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# The default environment is for local `wrangler dev` only. It must never be
# published: it sets ENVIRONMENT = "development" (non-Secure cookies, no HSTS,
# no AUTH_ENCRYPTION_KEY requirement) while still being bound to the bindings
# below. Deploys go through `npm run deploy`, which passes --env production.
workers_dev = false

# D1 Database binding
#
# NOTE: this is still the same database_id as [env.production] below. Until a
# separate development database exists (`wrangler d1 create clan-db-dev`, then
# replace the id here), `wrangler dev --remote` and any `wrangler d1 execute
# --remote` without `--env production` read and write production data.
[[d1_databases]]
binding = "DB"
database_name = "clan-db"
database_id = "85073827-66a2-4647-b7ff-9d0cbdcc3e60" # Replace with actual database_id after running `wrangler d1 create`

# R2 Binding (for avatars)
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "clan-avatars"

[vars]
ENVIRONMENT = "development"
FRONTEND_ORIGIN = "http://localhost:5173,http://192.168.1.200:5173,https://clan-frontend.pages.dev,http://localhost:8787"
EMAIL_VERIFICATION_URL_BASE = "http://localhost:5173"
BREVO_FROM_EMAIL = "no-reply@hinoki.my"
BREVO_FROM_NAME = "Family Tree"
ALLOWED_EMAILS = "pjiaquan@gmail.com"

[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_ORIGIN = "https://clan-frontend.pages.dev"
EMAIL_VERIFICATION_URL_BASE = "https://clan-frontend.pages.dev"
BREVO_FROM_EMAIL = "no-reply@hinoki.my"
BREVO_FROM_NAME = "Family Tree"
ALLOWED_EMAILS = "pjiaquan@gmail.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "clan-db"
database_id = "85073827-66a2-4647-b7ff-9d0cbdcc3e60"

[[env.production.r2_buckets]]
binding = "AVATARS"
bucket_name = "clan-avatars"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = false
head_sampling_rate = 1
persist = false
invocation_logs = false

[observability.traces]
enabled = false
persist = false
head_sampling_rate = 1
