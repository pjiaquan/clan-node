# Cloudflare Workers configuration

name = "clan-node"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# The default environment is for local `wrangler dev` only. It must never be
# published: it sets ENVIRONMENT = "development" (non-Secure cookies, no HSTS,
# no AUTH_ENCRYPTION_KEY requirement) while still being bound to the bindings
# below. Deploys go through `npm run deploy`, which passes --env production.
#
# IMPORTANT: wrangler inherits top-level keys into named environments, so
# [env.production] re-enables this explicitly. Setting it here alone removes
# the workers.dev route from the production Worker too; production sets it
# explicitly below, also to false.
workers_dev = false

# D1 Database binding for the default (development) environment.
#
# Deliberately a different database from [env.production]. They used to share
# one, so `wrangler dev --remote` and any `wrangler d1 execute --remote`
# without `--env production` read and wrote live family data.
[[d1_databases]]
binding = "DB"
database_name = "clan-db-dev"
database_id = "977804d1-55e9-4757-9438-293aa45da716"

# R2 Binding (for avatars)
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "clan-avatars"

[vars]
ENVIRONMENT = "development"
FRONTEND_ORIGIN = "http://localhost:5173,http://192.168.1.200:5173,https://clan-frontend.pages.dev,http://localhost:8787"
EMAIL_VERIFICATION_URL_BASE = "http://localhost:5173"
BREVO_FROM_EMAIL = "no-reply@hinoki.my"
BREVO_FROM_NAME = "Family Tree"
ALLOWED_EMAILS = "pjiaquan@gmail.com"

[env.production]
# Off, like the inherited top-level value: the Worker's only entry point is the
# Pages Function's `API` service binding (wrangler.toml). A public workers.dev
# hostname let anyone skip Pages, and the Pages Function's old fetch() to it
# made every user arrive from the Workers egress IP, collapsing the IP-keyed
# rate limits into one shared bucket.
workers_dev = false
# Per-version preview hostnames are an extra public entry point to the same
# Worker and the same production database, and nothing needs them.
preview_urls = false

[env.production.vars]
ENVIRONMENT = "production"
FRONTEND_ORIGIN = "https://clan-frontend.pages.dev"
EMAIL_VERIFICATION_URL_BASE = "https://clan-frontend.pages.dev"
BREVO_FROM_EMAIL = "no-reply@hinoki.my"
BREVO_FROM_NAME = "Family Tree"
ALLOWED_EMAILS = "pjiaquan@gmail.com"
# Refuse enc:v1 protected values. Enabled once production held no v1 rows
# (verified 2026-10-11); see "Protected fields" in SECURITY.md.
DATA_PROTECTION_REJECT_LEGACY = "true"

[[env.production.d1_databases]]
binding = "DB"
database_name = "clan-db"
database_id = "85073827-66a2-4647-b7ff-9d0cbdcc3e60"

[[env.production.r2_buckets]]
binding = "AVATARS"
bucket_name = "clan-avatars"

# Observability was fully disabled, which left no forensic trail at all: the
# CSRF rejections, audit-write failures and dual-write failures the code logs
# were all discarded, so there was no way to tell afterwards whether anything
# had been attempted. Workers Logs is billed per event -- the volume here is
# small, but it is not free.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = false
head_sampling_rate = 1
